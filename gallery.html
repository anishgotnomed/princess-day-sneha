<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gallery — Sneha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="float-field"></div>

  <nav>
    <span class="brand">Sneha ❤️</span>
    <div class="nav-row">
      <a href="index.html">Home</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="story.html">Our Story</a>
    </div>
    <div class="nav-row">
      <a href="wishes.html">Wishes</a>
      <a href="surprise.html">Surprise</a>
    </div>
  </nav>

  <main>
    <section class="page">
      <h1 class="title">Her Royal Gallery</h1>
      <p class="subtitle">Every picture of you is a masterpiece &#128248;&#10024;</p>

      <div class="gallery-grid" id="grid">
        <!-- cards built by script.js below -->
      </div>
    </section>
  </main>

  <footer>Made with &#10084; for Sneha &bull; Happy Princess Day</footer>

  <script>
    // Gallery captions live here — edit these with your own words.
    const CAPTIONS = {
      1: 'My favourite smile',
      2: 'Golden girl',
      3: 'Princess in pink',
      4: 'Sunshine',
      5: 'Golden hour',
      6: 'Forever mine'
    };
    (function buildGallery() {
      const grid = document.getElementById('grid');
      for (let i = 1; i <= 6; i++) {
        const item = document.createElement('div');
        item.className = 'g-item';
        const img = document.createElement('img');
        img.src = 'images/pic' + i + '.jpg';
        img.alt = 'Sneha photo ' + i;
        img.dataset.pic = i;
        img.onerror = function () { window.fixPhoto(this); };
        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = CAPTIONS[i] || 'Pretty as always';
        item.appendChild(img);
        item.appendChild(cap);
        grid.appendChild(item);
      }
      // "Add" card — placeholder for new photos
      const add = document.createElement('div');
      add.className = 'g-item add-card';
      add.innerHTML = '<span class="add-icon">＋</span><span class="add-text">Add</span>';
      grid.appendChild(add);
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
